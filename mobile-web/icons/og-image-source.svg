<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- icon 造型（沿用 favicon 的音波轉文字意象，放大置中偏左）-->
  <g transform="translate(180 205)">
    <rect width="220" height="220" rx="55" fill="#111827"/>
    <g transform="translate(30 30)">
      <path d="M 5 9 Q 9 4 13 9 T 21 9 L 27 9" fill="none" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" transform="scale(5.2)"/>
      <path d="M 5 16 Q 9 11 13 16 T 21 16 L 27 16" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" transform="scale(5.2)"/>
      <path d="M 5 23 Q 9 18 13 23 T 21 23 L 27 23" fill="none" stroke="#EC4899" stroke-width="2.5" stroke-linecap="round" transform="scale(5.2)"/>
    </g>
  </g>

  <!-- 產品名稱與標語 -->
  <text x="480" y="300" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#F8FAFC">podscript</text>
  <text x="480" y="360" font-family="Heiti TC, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#94A3B8">Podcast 逐字稿工具</text>
  <text x="480" y="410" font-family="Heiti TC, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#64748B">分角色逐字稿 / 摘要 / 心智圖</text>
</svg>
