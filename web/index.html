<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>podscript · 本機</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<!-- 先套上記住的深/淺色，避免載入時閃一下（切換邏輯在 common.js） -->
<script>try { const t = localStorage.getItem("podscript_theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>

<header class="topbar">
  <button id="btn-menu" class="icon-btn" type="button" aria-label="切換清單">☰</button>
  <h1 class="brand">
    <a href="#">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#F8FAFC"/>
        <path d="M 16 3 L 27 9.5 L 27 22.5 L 16 29 L 5 22.5 L 5 9.5 Z" fill="#0F172A"/>
        <path d="M 11 12 V 20" fill="none" stroke="#06B6D4" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 16 8 V 24" fill="none" stroke="#3B82F6" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 21 12 V 20" fill="none" stroke="#EC4899" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">podscript</span>
    </a>
  </h1>
  <form id="start-form" class="start">
    <select id="kind" aria-label="內容類型" title="自動：Apple Podcast 與 YouTube 以外的網址視為文章">
      <option value="auto">自動</option>
      <option value="podcast">Podcast</option>
      <option value="article">文章</option>
      <option disabled>──────</option>
      <option value="paste">貼上全文…</option>
      <option value="pdf">上傳論文…</option>
    </select>
    <input id="url" type="url" placeholder="貼上 Podcast、YouTube 或文章網址…" required>
    <div class="start-projects">
      <button id="btn-start-projects" type="button" class="secondary" aria-haspopup="true" aria-expanded="false"
              title="處理完成後歸入的研究專案（選填，可多選）">專案</button>
      <div id="start-projects-menu" class="start-projects-menu" hidden>
        <p class="muted">處理完成後歸入（可多選）</p>
        <div id="start-projects-list"></div>
      </div>
    </div>
    <button type="submit" id="btn-start">開始</button>
    <input id="pdf-file" type="file" accept="application/pdf,.pdf" hidden>
  </form>
  <a class="topbar-link" href="/projects">研究專案</a>
  <button id="btn-theme" class="theme-btn" type="button" aria-label="切換為深色" title="切換為深色"><svg aria-hidden="true"><use href="#ic-moon"/></svg></button>
</header>

<div class="layout">

  <svg width="0" height="0" style="position:absolute;overflow:hidden;" aria-hidden="true">
    <defs>
      <symbol id="ic-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M12 2.5v2.6M12 18.9v2.6M4.6 4.6l1.85 1.85M17.55 17.55l1.85 1.85M2.5 12h2.6M18.9 12h2.6M4.6 19.4l1.85-1.85M17.55 6.45l1.85-1.85" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </symbol>
      <symbol id="ic-moon" viewBox="0 0 24 24">
        <path d="M20 14.2A8.5 8.5 0 1 1 9.8 4a6.8 6.8 0 0 0 10.2 10.2Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </symbol>
      <symbol id="ic-audio" viewBox="0 0 24 24">
        <path d="M4.5 15v-2.5a7.5 7.5 0 0 1 15 0V15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M4.5 14.5h2a1.2 1.2 0 0 1 1.2 1.2v3.1a1.2 1.2 0 0 1-1.2 1.2h-.8a1.2 1.2 0 0 1-1.2-1.2zM19.5 14.5h-2a1.2 1.2 0 0 0-1.2 1.2v3.1a1.2 1.2 0 0 0 1.2 1.2h.8a1.2 1.2 0 0 0 1.2-1.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </symbol>
      <symbol id="ic-video" viewBox="0 0 24 24">
        <rect x="3.5" y="5.5" width="17" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M10.3 9.4v5.2l4.4-2.6z" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>
      </symbol>
      <symbol id="ic-paper" viewBox="0 0 24 24">
        <path d="M14 3.5H7a1.5 1.5 0 0 0-1.5 1.5v14A1.5 1.5 0 0 0 7 20.5h10a1.5 1.5 0 0 0 1.5-1.5V8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M14 3.5V8h4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M8.5 12h7M8.5 15h7M8.5 18h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </symbol>
      <symbol id="ic-article" viewBox="0 0 24 24">
        <path d="M16.5 19H5a1.5 1.5 0 0 1-1.5-1.5V5.5a1 1 0 0 1 1-1h11a1 1 0 0 1 1 1V17.5a1.5 1.5 0 0 0 3 0V9h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M7 8.5h6M7 12h6M7 15.5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <aside id="sidebar" class="sidebar">
    <button id="btn-collapse-sidebar" class="sidebar-collapse" type="button" aria-label="收合清單" title="收合清單">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 6l-6 6 6 6M19 6l-6 6 6 6"/></svg>
    </button>
    <section id="queue-box" class="queue-box" hidden>
      <h2>手機待處理 <span id="queue-count" class="queue-count">0</span></h2>
      <ul id="queue-list" class="queue-list"></ul>
    </section>

    <div class="sidebar-head">
      <h2>單集</h2>
      <input id="filter" type="search" placeholder="搜尋標題或標籤…">
    </div>
    <ul id="episode-list" class="episode-list"></ul>
  </aside>

  <main id="content">

    <section id="empty" class="card placeholder">
      <p>貼上 Apple Podcast 單集、YouTube 影片或文章網址開始，也可以上傳論文 PDF，<br>或從左側選擇已處理的單集。</p>
    </section>

    <section id="progress" class="card" hidden>
      <h2 id="progress-title"></h2>
      <ol class="stages" id="stages"></ol>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
      <p class="status">
        <span class="spinner" id="spinner"></span>
        <span id="progress-message"></span>
        <span class="muted" id="progress-elapsed"></span>
        <button id="btn-resume" type="button" hidden>▶ 繼續處理</button>
        <button id="btn-cancel-job" type="button" class="danger" hidden>終止排隊</button>
        <button id="btn-delete-job" type="button" class="danger" hidden>刪除</button>
      </p>
    </section>

    <section id="episode" class="card" hidden>
      <div class="episode-head">
        <div>
          <h2 id="ep-title"></h2>
          <p class="title-zh" id="ep-title-zh" hidden></p>
          <p class="muted" id="ep-meta"></p>
          <a id="ep-source" class="source-link" target="_blank" rel="noopener noreferrer" hidden></a>
        </div>
        <div class="actions">
          <button id="btn-download" type="button">下載</button>
          <div id="upload-group" class="btn-group">
            <button id="btn-discard-regen" type="button" hidden>放棄重新生成</button>
            <button id="btn-upload" type="button">上傳</button>
          </div>
          <button id="btn-delete" type="button" class="danger">刪除</button>
        </div>
      </div>

      <div class="block">
        <div class="block-head">
          <h3>摘要 · 心智圖 · 標籤</h3>
          <button id="btn-regen" type="button">重新生成全部</button>
        </div>
        <p id="summary-text"></p>
        <p id="hashtags" class="tags"></p>
        <div id="tag-review" class="tag-review" hidden></div>
      </div>

      <div class="block">
        <div class="block-head">
          <h3>研究專案</h3>
        </div>
        <div id="episode-projects" class="project-chips"></div>
      </div>

      <div class="block">
        <div class="block-head">
          <h3>封面</h3>
          <button id="btn-regen-cover" type="button">重新生成封面</button>
        </div>
        <div class="cover-row">
          <div id="cover" class="cover-preview" hidden></div>
          <p id="cover-empty" class="muted">尚未生成</p>
        </div>
      </div>

      <div class="block">
        <div class="block-head">
          <h3>心智圖</h3>
        </div>
        <div class="mindmap-wrap">
          <div id="mindmap"></div>
          <button id="btn-mindmap-full" class="mindmap-full-btn" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>放大檢視
          </button>
        </div>
      </div>

      <div class="block">
        <div class="block-head">
          <h3 id="transcript-heading">逐字稿</h3>
          <div id="speaker-controls" class="speakers"></div>
          <div id="translate-controls" class="translate-controls" hidden>
            <div id="lang-switch" class="lang-switch" role="group" aria-label="原文語言" hidden>
              <button type="button" data-lang="zh">中文</button>
              <button type="button" data-lang="en">English</button>
            </div>
            <button id="btn-translate" type="button">翻譯成中文</button>
          </div>
        </div>
        <nav id="chapters" class="chapters" aria-label="章節" hidden></nav>
        <div id="transcript"></div>
      </div>
    </section>

  </main>
</div>

<dialog id="download-dialog">
  <form method="dialog">
    <h3>下載</h3>
    <label><input type="checkbox" name="part" value="summary" checked> 摘要</label>
    <label><input type="checkbox" name="part" value="mindmap" checked> 心智圖</label>
    <label><input type="checkbox" name="part" value="transcript" checked> <span id="download-transcript-label">逐字稿</span></label>
    <hr>
    <label><input type="radio" name="format" value="md" checked> Markdown</label>
    <label><input type="radio" name="format" value="pdf"> PDF</label>
    <menu>
      <button value="cancel">取消</button>
      <button id="btn-do-download" value="ok" type="button">下載</button>
    </menu>
  </form>
</dialog>

<dialog id="paste-dialog" class="paste-dialog">
  <form id="paste-form" method="dialog">
    <h3>貼上文章全文</h3>
    <input id="paste-title" type="text" placeholder="標題（留空取第一段開頭）">
    <textarea id="paste-text" rows="14" placeholder="貼上文章內容…" required></textarea>
    <menu>
      <button value="cancel" formnovalidate>取消</button>
      <button id="btn-paste-submit" value="ok" class="primary">開始</button>
    </menu>
  </form>
</dialog>

<!-- 心智圖全螢幕：頁面內只放唯讀縮圖（不攔滾輪，捲頁面不會誤縮放），
     要拖曳縮放時才進這裡操作。 -->
<div id="mindmap-overlay" class="mindmap-overlay" hidden role="dialog" aria-modal="true" aria-label="心智圖">
  <div class="mindmap-overlay-bar">
    <span class="mindmap-overlay-title">心智圖</span>
    <button id="btn-mindmap-reset" type="button">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg>重置
    </button>
    <button id="btn-mindmap-close" type="button">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>關閉
    </button>
  </div>
  <div class="mindmap-stage">
    <div id="mindmap-full"></div>
    <span class="mindmap-stage-hint">拖曳平移 · 滾輪縮放 · Esc 關閉</span>
  </div>
</div>

<script type="module">
  // 心智圖改用 markmap 渲染（資料仍存 mermaid 語法，前端轉譯）。
  // 掛到 window 供非-module 的 app.js 呼叫。
  import { renderMindmap } from "./mindmap-render.js";
  window.renderMarkmap = renderMindmap;
</script>
<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
