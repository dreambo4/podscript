<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>podscript · 本機</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <button id="btn-menu" class="icon-btn" type="button" aria-label="切換清單">☰</button>
  <h1 class="brand">
    <a href="#">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#F8FAFC"/>
        <path d="M 16 3 L 27 9.5 L 27 22.5 L 16 29 L 5 22.5 L 5 9.5 Z" fill="#0F172A"/>
        <path d="M 11 12 V 20" fill="none" stroke="#06B6D4" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 16 8 V 24" fill="none" stroke="#3B82F6" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 21 12 V 20" fill="none" stroke="#EC4899" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">podscript</span>
    </a>
  </h1>
  <form id="start-form" class="start">
    <select id="kind" aria-label="內容類型" title="自動：Apple Podcast 與 YouTube 以外的網址視為文章">
      <option value="auto">自動</option>
      <option value="podcast">Podcast</option>
      <option value="article">文章</option>
    </select>
    <input id="url" type="url" placeholder="貼上 Podcast、YouTube 或文章網址…" required>
    <button type="submit">開始</button>
    <button id="btn-paste" type="button" class="secondary" title="付費文章或抓不到正文時，直接貼上全文">貼上全文</button>
  </form>
</header>

<div class="layout">

  <aside id="sidebar" class="sidebar">
    <section id="queue-box" class="queue-box" hidden>
      <h2>手機待處理 <span id="queue-count" class="queue-count">0</span></h2>
      <ul id="queue-list" class="queue-list"></ul>
    </section>

    <div class="sidebar-head">
      <h2>單集</h2>
      <input id="filter" type="search" placeholder="搜尋標題或標籤…">
    </div>
    <ul id="episode-list" class="episode-list"></ul>
  </aside>

  <main id="content">

    <section id="empty" class="card placeholder">
      <p>貼上 Apple Podcast 單集、YouTube 影片或文章網址開始，<br>或從左側選擇已處理的單集。</p>
    </section>

    <section id="progress" class="card" hidden>
      <h2 id="progress-title"></h2>
      <ol class="stages" id="stages"></ol>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
      <p class="status">
        <span class="spinner" id="spinner"></span>
        <span id="progress-message"></span>
        <span class="muted" id="progress-elapsed"></span>
        <button id="btn-resume" type="button" hidden>▶ 繼續處理</button>
      </p>
    </section>

    <section id="episode" class="card" hidden>
      <div class="episode-head">
        <div>
          <h2 id="ep-title"></h2>
          <p class="muted" id="ep-meta"></p>
          <a id="ep-source" class="source-link" target="_blank" rel="noopener noreferrer" hidden></a>
        </div>
        <div class="actions">
          <button id="btn-download" type="button">下載</button>
          <button id="btn-upload" type="button">上傳</button>
          <button id="btn-delete" type="button" class="danger">刪除</button>
        </div>
      </div>

      <div class="block">
        <div class="block-head">
          <h3>摘要 · 心智圖 · 標籤</h3>
          <button id="btn-regen" type="button">重新生成全部</button>
        </div>
        <p id="summary-text"></p>
        <p id="hashtags" class="tags"></p>
        <div id="tag-review" class="tag-review" hidden></div>
      </div>

      <div class="block">
        <div class="block-head">
          <h3>心智圖</h3>
        </div>
        <div class="mindmap-wrap">
          <div id="mindmap"></div>
          <button id="btn-mindmap-full" class="mindmap-full-btn" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>放大檢視
          </button>
        </div>
      </div>

      <div class="block">
        <div class="block-head">
          <h3 id="transcript-heading">逐字稿</h3>
          <div id="speaker-controls" class="speakers"></div>
        </div>
        <div id="transcript"></div>
      </div>
    </section>

  </main>
</div>

<dialog id="download-dialog">
  <form method="dialog">
    <h3>下載</h3>
    <label><input type="checkbox" name="part" value="summary" checked> 摘要</label>
    <label><input type="checkbox" name="part" value="mindmap" checked> 心智圖</label>
    <label><input type="checkbox" name="part" value="transcript" checked> <span id="download-transcript-label">逐字稿</span></label>
    <hr>
    <label><input type="radio" name="format" value="md" checked> Markdown</label>
    <label><input type="radio" name="format" value="pdf"> PDF</label>
    <menu>
      <button value="cancel">取消</button>
      <button id="btn-do-download" value="ok" type="button">下載</button>
    </menu>
  </form>
</dialog>

<dialog id="paste-dialog" class="paste-dialog">
  <form id="paste-form" method="dialog">
    <h3>貼上文章全文</h3>
    <input id="paste-title" type="text" placeholder="標題（留空取第一段開頭）">
    <textarea id="paste-text" rows="14" placeholder="貼上文章內容…" required></textarea>
    <menu>
      <button value="cancel" formnovalidate>取消</button>
      <button id="btn-paste-submit" value="ok" class="primary">開始</button>
    </menu>
  </form>
</dialog>

<!-- 心智圖全螢幕：頁面內只放唯讀縮圖（不攔滾輪，捲頁面不會誤縮放），
     要拖曳縮放時才進這裡操作。 -->
<div id="mindmap-overlay" class="mindmap-overlay" hidden role="dialog" aria-modal="true" aria-label="心智圖">
  <div class="mindmap-overlay-bar">
    <span class="mindmap-overlay-title">心智圖</span>
    <button id="btn-mindmap-reset" type="button">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg>重置
    </button>
    <button id="btn-mindmap-close" type="button">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>關閉
    </button>
  </div>
  <div class="mindmap-stage">
    <div id="mindmap-full"></div>
    <span class="mindmap-stage-hint">拖曳平移 · 滾輪縮放 · Esc 關閉</span>
  </div>
</div>

<script type="module">
  // 心智圖改用 markmap 渲染（資料仍存 mermaid 語法，前端轉譯）。
  // 掛到 window 供非-module 的 app.js 呼叫。
  import { renderMindmap } from "./mindmap-render.js";
  window.renderMarkmap = renderMindmap;
</script>
<script src="app.js"></script>
</body>
</html>
